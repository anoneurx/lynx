# Rust workspace for LYNX.
#
# Naming: workspace crates use `lynx-<area>-<component>`.
# Deployable binaries live in `apps/` and `services/`; libraries in `packages/`.
#
# Design: docs/architecture/specification.md. Implementation order: §Z.

[workspace]
resolver = "2"
members = [
  # shared libraries
  "packages/common",
  "packages/models",
  "packages/config",
  "packages/logging",
  "packages/security",

  # backend services (libraries in v0.1, binaries later)
  "services/query",
  "services/ranker",
  "services/suggestions",
  "services/frontier",
  "services/parser",
  "services/indexer",
  "services/crawler",
  "services/ai",

  # applications
  "apps/api",
]

exclude = [
  "infrastructure",
  "research",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
repository = "https://github.com/anoneurx/lynx"
authors = ["Anoneurx <engineering@anoneurx.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

# Dependency versions are declared once here and inherited by member crates.
[workspace.dependencies]
# core
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async / web
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "net"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit"] }

# logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# config / secrets
config = "0.14"
secrecy = "0.8"
zeroize = "1"

# data
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros"] }
tantivy = "0.22"

# networking / text
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
regex = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"

# ids / hashing / crypto primitives
uuid = { version = "1", features = ["v7", "v5", "serde"] }
blake3 = "1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# time
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }

# dev
proptest = "1"
pretty_assertions = "1"
tempfile = "3"

# internal crates
lynx-common = { path = "packages/common" }
lynx-models = { path = "packages/models" }
lynx-config = { path = "packages/config" }
lynx-logging = { path = "packages/logging" }
lynx-security = { path = "packages/security" }
lynx-query = { path = "services/query" }
lynx-indexer = { path = "services/indexer" }
