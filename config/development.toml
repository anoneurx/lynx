# `config/development.toml`
#
# Local development overrides. Small budgets, verbose, fast feedback.
# These values are intentionally NOT production-safe; the production validator
# rejects several of them by name.
#
# Secrets come from `.env` (gitignored) in development, never from this file.

[core]
environment = "development"
log_level   = "debug"
log_format  = "pretty"

[api]
bind                = "0.0.0.0:8080"
public_url          = "http://localhost:3000"
cors_origins        = ["http://localhost:3000", "http://127.0.0.1:5173"]
trusted_proxy_depth = 0
max_query_bytes     = 512
max_results_per_page = 50
default_results     = 10
max_candidates      = 2000

[api.pagination]
mode      = "cursor"
max_limit = 50

[database]
max_connections      = 20
statement_timeout_ms = 30000

[cache.query]
enabled     = true
ttl_seconds = 30          # short, so a re-index is visible immediately while developing

[index]
dir                = "/tmp/lynx-dev-index"
shards             = 1
memory_budget_mb   = 512
commit_interval_seconds = 5
commit_docs_threshold  = 500

[ranking]
config_version = "dev-local"
candidates     = 2000
snippet_max_chars = 240

[ranking.signals]
bm25         = 1.00
freshness    = 0.18
quality      = 0.12
authority    = 0.15
context      = 0.10
spam_penalty = 0.40

[crawler]
user_agent       = "LynxBot/0.1-dev (+https://anoneurx.com/lynx/bot)"
concurrency      = 4
allowed_schemes  = ["http", "https"]
allowed_ports    = [80, 443, 8080, 8443]   # local fixture server ports
max_redirects    = 5
max_depth        = 6
max_response_bytes = 1048576                # 1 MiB in development
max_decompression_ratio = 50
connect_timeout_ms   = 2000
header_timeout_ms    = 2000
read_idle_timeout_ms = 2000
total_timeout_ms     = 8000
respect_robots       = true
cache_robots         = true

[crawler.budget]
max_pages_per_host_day   = 200
max_bytes_per_host_day   = 52428800
min_inter_request_ms    = 200
max_concurrent_per_host  = 2

[privacy]
query_logging        = false
metrics_query_shapes = true
response_cache       = true
third_party_assets   = "forbidden"

[privacy.rate_limit]
enabled              = true
prefix_bits_v4        = 24
prefix_bits_v6        = 48
salt_ttl_hours        = 24
anonymous_per_minute  = 120     # generous so local testing does not self-throttle
developer_per_minute  = 600

[security]
tls_min_version   = "1.3"
admin_require_vpn = false      # dev only; true everywhere else

[ai]
enabled   = false
provider  = "none"
fail_closed = true

[observability]
metrics_bind       = "0.0.0.0:9090"
tracing            = false
tracing_sample_ratio = 1.0    # full local tracing while debugging
log_retention_days = 1

[admin]
enable_basic_auth = true
bind              = "127.0.0.1:9091"