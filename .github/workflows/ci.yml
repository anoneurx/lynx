name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: tsc + eslint + prettier
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check

      - name: internal markdown links
        run: scripts/check-links.sh

      - name: config validation (all environments)
        run: scripts/check-config.sh

  privacy:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: banned log and metric fields
        run: scripts/check-privacy.sh
      - name: privacy invariant suite
        run: |
          cargo test -p lynx-test-security --test privacy --locked

  tests:
    name: Unit, integration, security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lynx
          POSTGRES_PASSWORD: lynx_test_only
          POSTGRES_DB: lynx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lynx -d lynx_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LYNX_ENV: test
      LYNX_DATABASE_URL: postgres://lynx:lynx_test_only@localhost:5432/lynx_test
      LYNX_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast
      - name: security suites
        run: cargo nextest run -p lynx-test-security --locked
      - name: upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: target/nextest/
          retention-days: 7