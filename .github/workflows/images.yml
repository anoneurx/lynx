name: Images

on:
  push:
    branches: [main]
    paths: ["infrastructure/docker/**", "services/**", "apps/**", "packages/**", "Cargo.toml"]
  pull_request:
    paths: ["infrastructure/docker/**", "services/**", "apps/**", "packages/**", "Cargo.toml"]
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write          # OIDC, not static cloud credentials

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, crawler, indexer, ai, web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.run_started_at }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Sign and attach provenance
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: cosign sign
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
        run: cosign sign --yes "$IMAGE"

  # The crawler and AI images carry the highest-privilege capabilities in the platform.
  # They get a manual review step before any production promotion.
  privileged-review:
    name: Review privileged images
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review crawler and AI image provenance before production promotion."